# draaiter op Netlify.
# Uitrollen gebeurt vanuit GitHub Actions (.github/workflows/update.yml), niet door Netlify zelf:
# koppel de site dus NIET aan de GitHub-repository, anders bouwt Netlify zonder programma.

[build]
  publish = "dist"
  command = "node build.js"

[functions]
  directory = "netlify/functions"
  # het opgehaalde programma gaat mee in de functie
  included_files = ["data/showtimes.json"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    # Niet in zoekmachines zolang de app nog niet gelanceerd is. Weghalen bij de lancering.
    X-Robots-Tag = "noindex, nofollow"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
